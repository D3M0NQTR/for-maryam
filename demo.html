<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>US — demo 🤍</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%A4%8D%3C/text%3E%3C/svg%3E">
<style>
  :root{ --font:ui-rounded,-apple-system,"SF Pro Rounded","Segoe UI",system-ui,sans-serif; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0b0712;overflow:hidden;font-family:var(--font);color:#fff;
    user-select:none;-webkit-user-select:none;touch-action:none}
  #stage{position:fixed;inset:0;overflow:hidden}
  #bg{position:absolute;inset:-6%;background-size:cover;background-position:center;
    animation:drift 26s ease-in-out infinite alternate;will-change:transform}
  @keyframes drift{0%{transform:scale(1.04) translate(0,0)}100%{transform:scale(1.12) translate(-2%,-1%)}}
  #vig{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 80% at 50% 40%,transparent 40%,rgba(10,6,20,.55) 100%),
    linear-gradient(to bottom,rgba(10,6,20,.25),transparent 30%,rgba(10,6,20,.75))}
  #fx{position:absolute;inset:0;pointer-events:none}
  /* dialogue */
  #dlg{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);
    width:min(620px,92vw);background:rgba(20,10,28,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,182,214,.28);border-radius:20px;padding:18px 20px 20px;
    box-shadow:0 16px 50px rgba(0,0,0,.5);opacity:0;transition:opacity .5s;min-height:96px}
  #dlg.show{opacity:1}
  #who{font-size:13px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
    color:#ffb6d6;margin-bottom:7px;min-height:16px;text-shadow:0 0 14px rgba(246,161,196,.6)}
  #who.narr{color:rgba(255,255,255,.5)}
  #line{font-size:clamp(17px,4.7vw,21px);line-height:1.5;font-weight:600;min-height:52px}
  #adv{position:absolute;right:16px;bottom:12px;font-size:12px;color:rgba(255,255,255,.6);
    opacity:0;animation:blink 1.4s ease-in-out infinite}
  #adv.show{opacity:1}
  @keyframes blink{0%,100%{opacity:.3}50%{opacity:.9}}
  /* choices */
  #choices{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);
    width:min(620px,92vw);display:flex;flex-direction:column;gap:10px;opacity:0;pointer-events:none;transition:opacity .4s}
  #choices.show{opacity:1;pointer-events:auto}
  .choice{cursor:pointer;text-align:left;border:1px solid rgba(255,182,214,.35);border-radius:16px;
    padding:15px 18px;font-family:var(--font);font-size:clamp(15px,4.3vw,18px);font-weight:700;color:#fff;
    background:rgba(30,14,40,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:transform .12s ease,background .2s,border-color .2s;min-height:52px}
  .choice:active{transform:scale(.96)}
  .choice:hover{background:rgba(60,26,74,.85);border-color:rgba(255,182,214,.7)}
  .choice .q{color:#ffb6d6;margin-right:6px}
  /* overlays */
  .over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;text-align:center;padding:34px;z-index:5;
    background:radial-gradient(120% 90% at 50% 40%,#2a1330 0%,#160a22 60%,#0b0712 100%);transition:opacity .9s}
  .over.hide{opacity:0;pointer-events:none}
  .ttl{font-family:"Snell Roundhand","Savoye LET",cursive;font-size:clamp(52px,17vw,104px);font-weight:700;
    text-shadow:0 0 36px rgba(246,161,196,.7)}
  .sub{font-size:clamp(15px,4.4vw,18px);color:rgba(255,255,255,.82);max-width:440px;line-height:1.55}
  .btn{cursor:pointer;border:none;border-radius:999px;padding:16px 30px;font-family:var(--font);
    font-size:17px;font-weight:800;color:#4a1030;background:linear-gradient(180deg,#ffd7e6,#f6a1c4);
    box-shadow:0 12px 34px rgba(230,92,147,.5);transition:transform .15s}
  .btn:active{transform:scale(.93)}
  #mute{position:fixed;top:max(12px,env(safe-area-inset-top));right:14px;z-index:9;cursor:pointer;
    width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:19px}
  #tag{position:fixed;top:max(12px,env(safe-area-inset-top));left:16px;z-index:9;font-size:12px;
    font-weight:700;letter-spacing:.5px;color:rgba(255,255,255,.55)}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="vig"></div>
  <canvas id="fx"></canvas>
</div>
<div id="tag">US · chapter 1 · demo</div>
<button id="mute" aria-label="sound">🔊</button>

<div id="dlg"><div id="who"></div><div id="line"></div><div id="adv">tap ›</div></div>
<div id="choices"></div>

<div class="over" id="start">
  <div class="ttl">Us</div>
  <div class="sub">a tiny playable piece of the game.<br>this is how it works — tap through it. 🤍</div>
  <button class="btn" id="beginBtn">▶ play the demo</button>
  <div class="sub" style="font-size:13px;opacity:.6">sound on if you can</div>
</div>

<div class="over hide" id="end">
  <div class="ttl" style="font-size:clamp(30px,9vw,56px)">that's how US works</div>
  <div class="sub" id="endSub"></div>
  <button class="btn" id="replayBtn">↺ play again</button>
</div>

  /* ---------- neon particles ---------- */
  var fx=document.getElementById('fx'), fc=fx.getContext('2d'), W=0,H=0,DPR=1,parts=[];
  function rs(){ DPR=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight;
    fx.width=W*DPR; fx.height=H*DPR; fc.setTransform(DPR,0,0,DPR,0,0); }
  addEventListener('resize',rs); rs();
  for(var i=0;i<34;i++) parts.push({x:Math.random(),y:Math.random(),r:0.6+Math.random()*2.2,
    s:0.06+Math.random()*0.14, hue:Math.random()<0.5?'#ffb6d6':'#8fd3ff', a:0.2+Math.random()*0.5});
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function loop(){
    fc.clearRect(0,0,W,H);
    for(var i=0;i<parts.length;i++){ var p=parts[i];
      if(!reduce){ p.y-=p.s/H*60/60; p.x+=Math.sin((p.y+i)*3)*0.0004; if(p.y<-0.02){p.y=1.02;p.x=Math.random();} }
      fc.beginPath(); fc.globalAlpha=p.a; fc.fillStyle=p.hue;
      fc.shadowColor=p.hue; fc.shadowBlur=8; fc.arc(p.x*W,p.y*H,p.r,0,7); fc.fill();
    }
    fc.globalAlpha=1; fc.shadowBlur=0; requestAnimationFrame(loop);
  }
  loop();

  /* ---------- tiny ambient audio ---------- */
  var AC=null, mg=null, muted=false, voices=[];
  function audio(){
    if(AC) return;
    try{
      var C=window.AudioContext||window.webkitAudioContext; AC=new C();
      mg=AC.createGain(); mg.gain.value=0.0001; mg.connect(AC.destination);
      mg.gain.linearRampToValueAtTime(0.14, AC.currentTime+2);
      var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900; lp.connect(mg);
      [220,277,330].forEach(function(f,i){ var o=AC.createOscillator(),g=AC.createGain();
        o.type='sine'; o.frequency.value=f; o.detune.value=(i-1)*5; g.gain.value=0.5/(i+1);
        o.connect(g); g.connect(lp); o.start(); voices.push(o); });
    }catch(e){ AC=null; }
  }
  document.getElementById('mute').addEventListener('click',function(){
    muted=!muted; this.textContent=muted?'🔈':'🔊';
    if(AC) mg.gain.linearRampToValueAtTime(muted?0.0001:0.14, AC.currentTime+0.3);
  });

  /* ---------- script ---------- */
  var SCRIPT = [
    {who:'narr', text:'November 27, 2022. the whole world was loud that night.'},
    {who:'narr', text:'a World Cup outside. a concert. thousands of people.'},
    {who:'narr', text:'and then — you.'},
    {choice:[
      {label:'"i saw you before the music even started."',
       then:[{who:'MARYAM', text:'"smooth. did that line ever actually work?"'},
             {who:'MOHAMMED', text:'"first time trying it. you tell me."'}]},
      {label:'"do you always glow like that, or is it the lights?"',
       then:[{who:'MARYAM', text:'"…okay. that one got me. a little."'},
             {who:'MOHAMMED', text:'"i\'ll take a little. for now."'}]},
      {label:'(just look at her, and smile)',
       then:[{who:'MARYAM', text:'"you\'re staring."'},
             {who:'MOHAMMED', text:'"i know. i can\'t really help it."'}]}
    ]},
    {who:'MARYAM', text:'"…i\'m Maryam."'},
    {who:'MOHAMMED', text:'"Mohammed. i think i\'m going to remember this night."'},
    {who:'narr', text:'you had no idea yet. neither of you did.'},
    {who:'narr', text:'that this was the beginning of us.'}
  ];

  var dlg=document.getElementById('dlg'), whoEl=document.getElementById('who'),
      lineEl=document.getElementById('line'), advEl=document.getElementById('adv'),
      choicesEl=document.getElementById('choices');
  var idx=0, queue=[], typing=false, typeTimer=0, full='', ci=0;

  function setSteps(){ queue = SCRIPT.slice(); idx=0; }
  function current(){ return queue[idx]; }

  function typeLine(step){
    typing=true; advEl.classList.remove('show');
    whoEl.textContent = step.who==='narr' ? '' : step.who;
    whoEl.className = step.who==='narr' ? 'narr' : '';
    full = step.text; ci=0; lineEl.textContent='';
    clearInterval(typeTimer);
    typeTimer=setInterval(function(){
      ci++; lineEl.textContent=full.slice(0,ci);
      if(ci>=full.length){ clearInterval(typeTimer); typing=false; advEl.classList.add('show'); }
    }, 30);
  }
  function finishTyping(){ clearInterval(typeTimer); lineEl.textContent=full; typing=false; advEl.classList.add('show'); }

  function showChoice(step){
    dlg.classList.remove('show');
    choicesEl.innerHTML='';
    step.choice.forEach(function(opt){
      var b=document.createElement('button'); b.className='choice';
      b.innerHTML='<span class="q">▸</span>'+opt.label;
      b.addEventListener('click',function(ev){ ev.stopPropagation();
        // splice the chosen branch into the queue after this step
        queue.splice(idx+1,0,...opt.then);
        choicesEl.classList.remove('show');
        setTimeout(function(){ next(); }, 180);
      });
      choicesEl.appendChild(b);
    });
    choicesEl.classList.add('show');
  }

  function render(){
    var step=current();
    if(!step){ endDemo(); return; }
    if(step.choice){ showChoice(step); return; }
    dlg.classList.add('show'); typeLine(step);
  }
  function next(){
    if(typing){ finishTyping(); return; }
    if(choicesEl.classList.contains('show')) return;
    idx++;
    render();
  }

  document.getElementById('stage').addEventListener('click', next);
  dlg.addEventListener('click', function(e){ e.stopPropagation(); next(); });

  function endDemo(){
    dlg.classList.remove('show');
    document.getElementById('endSub').innerHTML =
      "living scenes · your real faces · choices that matter.<br><br>"+
      "the full game keeps going: coffee, the cats, the storm,<br>and the part where she plays it as <b>you</b>.<br><br>this was just the first 2 minutes, baby. 🤍";
    document.getElementById('end').classList.remove('hide');
  }

  document.getElementById('beginBtn').addEventListener('click', function(){
    audio(); document.getElementById('start').classList.add('hide');
    setSteps(); setTimeout(render, 700);
  });
  document.getElementById('replayBtn').addEventListener('click', function(){
    document.getElementById('end').classList.add('hide');
    choicesEl.classList.remove('show'); setSteps(); setTimeout(render, 400);
  });
})();
</script>
</body>
</html>
