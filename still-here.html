<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STILL HERE 🤍</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%A4%8D%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --ink:#f7eef4; --pink:#f6a1c4; --rose:#e35c93; --gold:#f5c86e;
    --font-round:ui-rounded,-apple-system,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0b0b16;overflow:hidden;font-family:var(--font-round);color:var(--ink);
    overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .layer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;text-align:center;padding:max(24px,env(safe-area-inset-top)) 26px max(24px,env(safe-area-inset-bottom));
    pointer-events:none}
  /* text card */
  #text{position:fixed;left:50%;bottom:14%;transform:translateX(-50%) translateY(14px);
    width:min(560px,88vw);opacity:0;transition:opacity .9s ease,transform .9s ease;
    font-size:clamp(19px,5.4vw,26px);line-height:1.5;font-weight:600;
    text-shadow:0 2px 22px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.5);letter-spacing:.2px}
  #text.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #text.center{bottom:auto;top:50%;transform:translateX(-50%) translateY(-50%) scale(.98)}
  #text.center.show{transform:translateX(-50%) translateY(-50%) scale(1)}
  #text .big{font-size:clamp(26px,7.5vw,40px);font-weight:800}
  #text .script{font-family:"Snell Roundhand","Savoye LET","Apple Chancery",cursive;
    font-size:clamp(40px,13vw,74px);font-weight:700;color:#fff;
    text-shadow:0 0 30px rgba(246,161,196,.6),0 2px 10px rgba(0,0,0,.6)}
  /* hint */
  #hint{position:fixed;left:50%;bottom:7%;transform:translateX(-50%);opacity:0;
    transition:opacity .5s;font-size:14px;font-weight:600;letter-spacing:.4px;
    color:rgba(255,255,255,.72);pointer-events:none}
  #hint.show{opacity:1;animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:.95}}
  /* start + end screens */
  #start,#end{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:20px;padding:32px;text-align:center;
    background:radial-gradient(120% 90% at 50% 40%,#241633 0%,#120c20 55%,#0b0b16 100%);
    transition:opacity 1s ease}
  #end{opacity:0;pointer-events:none;background:radial-gradient(130% 100% at 50% 45%,#3a2340 0%,#1a1330 60%,#0f0b1c 100%)}
  .title{font-family:"Snell Roundhand","Savoye LET",cursive;font-size:clamp(46px,15vw,90px);
    font-weight:700;color:#fff;text-shadow:0 0 34px rgba(246,161,196,.65)}
  .sub{font-size:clamp(15px,4.4vw,19px);font-weight:600;color:rgba(255,255,255,.82);max-width:420px;line-height:1.5}
  .btn{pointer-events:auto;cursor:pointer;border:none;border-radius:999px;
    padding:16px 30px;font-family:var(--font-round);font-size:17px;font-weight:800;color:#4a1030;
    background:linear-gradient(180deg,#ffd7e6,#f6a1c4);box-shadow:0 10px 30px rgba(230,92,147,.45),inset 0 1px 0 rgba(255,255,255,.6);
    transition:transform .15s ease,box-shadow .2s ease;min-width:44px;min-height:44px}
  .btn:active{transform:scale(.93)}
  .btn.soft{background:linear-gradient(180deg,#ffffff,#ffe6f1)}
  /* mute */
  #mute{position:fixed;top:max(12px,env(safe-area-inset-top));right:14px;z-index:9;
    pointer-events:auto;cursor:pointer;width:42px;height:42px;border-radius:50%;border:none;
    background:rgba(255,255,255,.12);color:#fff;font-size:19px;line-height:42px;text-align:center;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .fadeout{opacity:0 !important;pointer-events:none !important}
  .sig{font-size:13px;color:rgba(255,255,255,.5);font-weight:600;letter-spacing:.5px}
  @media (prefers-reduced-motion:reduce){#text,#start,#end{transition-duration:.2s}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="text"></div>
<div id="hint"></div>
<button id="mute" aria-label="sound">🔊</button>

<div id="start">
  <div class="title">Still Here</div>
  <div class="sub">a little game. i made it for you, baby.<br>headphones on, if you can. 🤍</div>
  <button class="btn" id="beginBtn">hold my hand to begin</button>
  <div class="sig">— for Maryam</div>
</div>

<div id="end">
  <div class="title" style="font-size:clamp(34px,11vw,64px)">M&nbsp;♥&nbsp;M</div>
  <div class="sub" id="endMsg"></div>
  <button class="btn soft" id="replayBtn">walk it again 🤍</button>
  <div class="sig">screenshot this and send it to me. i'm waiting.</div>
</div>

<script>
"use strict";
(function(){
  /* ============================================================
     STILL HERE — an emotional journey. one file. from Mohammed.
     ============================================================ */
  var HER = "Maryam", HIM = "Mohammed";

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W=0,H=0,DPR=1;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize(){
    DPR = Math.min(2, window.devicePixelRatio||1);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.floor(W*DPR); canvas.height = Math.floor(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);

  /* ---------- input: hold to walk / tap to continue ---------- */
  var holding=false, freshTap=false;
  function down(e){ holding=true; freshTap=true; if(e.cancelable)e.preventDefault(); }
  function up(){ holding=false; }
  canvas.addEventListener('pointerdown',down);
  window.addEventListener('pointerup',up);
  window.addEventListener('pointercancel',up);
  window.addEventListener('keydown',function(e){
    if(e.code==='Space'||e.code==='ArrowRight'||e.code==='Enter'){ holding=true; freshTap=true; e.preventDefault(); }
  });
  window.addEventListener('keyup',function(e){
    if(e.code==='Space'||e.code==='ArrowRight'||e.code==='Enter'){ holding=false; }
  });

  /* ============================================================
     AUDIO — generative, layered, soft (never startling)
     ============================================================ */
  var A = {
    ctx:null, master:null, musicG:null, rainG:null, hbOn:false, muted:false,
    mode:'silent', chordIdx:0, barTimer:null, hbTimer:null, melTimer:null
  };
  var PROG = {
    lonely: [[57],[60],[55],[53]],                    // sparse minor single notes
    warm:   [[57,60,64],[53,57,60],[48,52,55],[55,59,62]], // Am F C G
    cold:   [[45,48,44],[45,48,44]],                  // low, uneasy
    swell:  [[57,60,64,69],[53,57,60,65],[48,52,55,60],[55,59,62,67]]
  };
  function m2f(m){ return 440*Math.pow(2,(m-69)/12); }

  function audioInit(){
    if(A.ctx) return;
    try{
      var AC = window.AudioContext||window.webkitAudioContext;
      A.ctx = new AC();
      A.master = A.ctx.createGain(); A.master.gain.value = 0.0001; A.master.connect(A.ctx.destination);
      var lp = A.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2400; lp.Q.value=0.3;
      lp.connect(A.master);
      A.musicG = A.ctx.createGain(); A.musicG.gain.value=0.9; A.musicG.connect(lp);
      // rain: filtered noise loop
      A.rainG = A.ctx.createGain(); A.rainG.gain.value=0.0001; A.rainG.connect(A.master);
      var buf = A.ctx.createBuffer(1, A.ctx.sampleRate*2, A.ctx.sampleRate);
      var d = buf.getChannelData(0);
      for(var i=0;i<d.length;i++){ d[i]=(Math.random()*2-1)*0.5; }
      var src = A.ctx.createBufferSource(); src.buffer=buf; src.loop=true;
      var rlp = A.ctx.createBiquadFilter(); rlp.type='bandpass'; rlp.frequency.value=1200; rlp.Q.value=0.4;
      src.connect(rlp); rlp.connect(A.rainG); src.start();
      A.master.gain.linearRampToValueAtTime(0.9, A.ctx.currentTime+1.2);
      startBars();
    }catch(e){ A.ctx=null; }
  }
  function note(midi, dur, type, gain, when){
    if(!A.ctx||A.muted) return;
    var t = when||A.ctx.currentTime;
    var o = A.ctx.createOscillator(), g = A.ctx.createGain();
    o.type = type||'sine'; o.frequency.value = m2f(midi);
    if(type==='triangle'){ var o2=A.ctx.createOscillator(); o2.type='sine';
      o2.frequency.value=m2f(midi); o2.detune.value=4; o2.connect(g); o2.start(t); o2.stop(t+dur+0.1); }
    var peak = (gain||0.14);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(peak, t+ (type==='sine'?0.7:0.03));
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(A.musicG); o.start(t); o.stop(t+dur+0.1);
  }
  function heartbeat(){
    if(!A.ctx||A.muted) return;
    var t=A.ctx.currentTime;
    [0,0.16].forEach(function(off,k){
      var o=A.ctx.createOscillator(), g=A.ctx.createGain();
      o.type='sine'; o.frequency.value= k?58:52;
      g.gain.setValueAtTime(0.0001,t+off);
      g.gain.linearRampToValueAtTime(0.22,t+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+off+0.28);
      o.connect(g); g.connect(A.master); o.start(t+off); o.stop(t+off+0.32);
    });
  }
  function bar(){
    if(A.mode==='silent') return;
    var prog = PROG[A.mode]||PROG.warm;
    A.chordIdx = (A.chordIdx+1) % prog.length;
    var ch = prog[A.chordIdx];
    if(A.mode==='lonely'){
      if(A.chordIdx%1===0) note(ch[0], 1.8, 'triangle', 0.12);
    } else if(A.mode==='cold'){
      note(ch[0], 2.2, 'sine', 0.10);
      note(ch[1], 2.2, 'sine', 0.07);
    } else {
      var g = A.mode==='swell'?0.13:0.10;
      ch.forEach(function(m){ note(m, 2.4, 'sine', g); });               // pad
      if(A.mode==='swell'||Math.random()<0.7){                            // melody
        var top = ch[ch.length-1]+ (Math.random()<0.5?12:7);
        note(top, 1.4, 'triangle', A.mode==='swell'?0.11:0.08);
      }
    }
  }
  function startBars(){
    if(A.barTimer) return;
    A.barTimer = setInterval(bar, 1900);
    setTimeout(bar, 120);
  }
  function setMode(mode, rain){
    A.mode = mode;
    if(A.ctx){
      A.rainG.gain.cancelScheduledValues(A.ctx.currentTime);
      A.rainG.gain.linearRampToValueAtTime(Math.max(0.0001, rain||0), A.ctx.currentTime+1.6);
    }
  }
  function setHeartbeat(on){
    A.hbOn = on;
    if(on && !A.hbTimer){ A.hbTimer=setInterval(heartbeat, 1150); heartbeat(); }
    if(!on && A.hbTimer){ clearInterval(A.hbTimer); A.hbTimer=null; }
  }
  document.getElementById('mute').addEventListener('click', function(){
    A.muted=!A.muted; this.textContent = A.muted?'🔈':'🔊';
    if(A.ctx){ A.master.gain.linearRampToValueAtTime(A.muted?0.0001:0.9, A.ctx.currentTime+0.3); }
  });

  /* ============================================================
     WORLD / RENDER
     ============================================================ */
  var sky = { top:[24,18,44], bot:[14,12,28] };      // current rgb
  var skyTarget = { top:[24,18,44], bot:[14,12,28] };
  var rainDensity = 1.0, rainTarget=1.0;
  var moonY = -120, moonTarget=-120, moonGlow=0, moonGlowT=0;
  var warmth = 0, warmthT = 0;                        // 0 cold .. 1 warm (ground/bloom)
  var starsAlpha=0, starsT=0;
  var scenery = [];   // drifting blooms + memory glows
  var rain = [];
  var groundOffset = 0;
  var walkPhase = 0;
  var shake = 0;
  var t0 = 0, lastT = 0;

  // cats
  var leo   = { x:0.40, base:0.78, bob:0, alpha:1, scale:1.0 };
  var demon = { x:0.40, base:0.78, bob:0, alpha:0, scale:1.28, gap:0.0 }; // gap = how far behind
  var hearts = [];

  function lerp(a,b,f){ return a+(b-a)*f; }
  function lerpRGB(a,b,f){ return [lerp(a[0],b[0],f),lerp(a[1],b[1],f),lerp(a[2],b[2],f)]; }
  function rgb(c,al){ return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+(al==null?1:al)+')'; }

  function initRain(){
    rain.length=0;
    for(var i=0;i<140;i++) rain.push({x:Math.random(),y:Math.random(),l:6+Math.random()*12,s:0.4+Math.random()*0.7});
  }

  function drawCat(x,y,s,coat,expr,a){
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(x,y);
    ctx.scale(s,s);
    // tail
    ctx.strokeStyle = coat.dark; ctx.lineWidth=9; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(20,6); ctx.quadraticCurveTo(46,2,42,-24); ctx.stroke();
    // body
    ctx.fillStyle = coat.base;
    ctx.beginPath(); ctx.ellipse(0,8,26,22,0,0,7); ctx.fill();
    // chest
    ctx.fillStyle = coat.belly;
    ctx.beginPath(); ctx.ellipse(-2,14,13,14,0,0,7); ctx.fill();
    // head
    ctx.fillStyle = coat.base;
    ctx.beginPath(); ctx.ellipse(0,-18,24,21,0,0,7); ctx.fill();
    // folded ears (small, down)
    ctx.beginPath(); ctx.moveTo(-20,-30); ctx.quadraticCurveTo(-26,-38,-14,-34);
    ctx.quadraticCurveTo(-16,-28,-20,-30); ctx.fill();
    ctx.beginPath(); ctx.moveTo(20,-30); ctx.quadraticCurveTo(26,-38,14,-34);
    ctx.quadraticCurveTo(16,-28,20,-30); ctx.fill();
    // muzzle
    ctx.fillStyle = coat.belly;
    ctx.beginPath(); ctx.ellipse(0,-10,11,8,0,0,7); ctx.fill();
    // eyes
    var ex=8.5, ey=-19;
    if(expr==='happy'){
      ctx.strokeStyle='#2a1c22'; ctx.lineWidth=2.6; ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(-ex,ey+2,4.5,Math.PI*1.15,Math.PI*1.95); ctx.stroke();
      ctx.beginPath(); ctx.arc(ex,ey+2,4.5,Math.PI*1.15,Math.PI*1.95); ctx.stroke();
    } else {
      ctx.fillStyle='#2a1c22';
      ctx.beginPath(); ctx.ellipse(-ex,ey,4.6,5.6,0,0,7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(ex,ey,4.6,5.6,0,0,7); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.9)';
      ctx.beginPath(); ctx.arc(-ex+1.6,ey-1.8,1.5,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(ex+1.6,ey-1.8,1.5,0,7); ctx.fill();
      if(expr==='serious'){ // grumpy brows
        ctx.strokeStyle=coat.dark; ctx.lineWidth=2.4; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(-ex-5,ey-7); ctx.lineTo(-ex+3,ey-5); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ex+5,ey-7); ctx.lineTo(ex-3,ey-5); ctx.stroke();
      }
    }
    // nose
    ctx.fillStyle=coat.nose||'#e88aa8';
    ctx.beginPath(); ctx.moveTo(-2.4,-11); ctx.lineTo(2.4,-11); ctx.lineTo(0,-8.5); ctx.closePath(); ctx.fill();
    // blush for leo
    if(coat.blush){ ctx.fillStyle=coat.blush;
      ctx.beginPath(); ctx.ellipse(-13,-11,4,2.6,0,0,7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(13,-11,4,2.6,0,0,7); ctx.fill(); }
    // whiskers
    ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(-8,-9); ctx.lineTo(-22,-11);
    ctx.moveTo(-8,-7); ctx.lineTo(-22,-6);
    ctx.moveTo(8,-9); ctx.lineTo(22,-11);
    ctx.moveTo(8,-7); ctx.lineTo(22,-6); ctx.stroke();
    // bow (leo)
    if(coat.bow){ ctx.fillStyle=coat.bow;
      ctx.beginPath(); ctx.moveTo(-16,-33); ctx.lineTo(-8,-38); ctx.lineTo(-8,-28); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-2,-33); ctx.lineTo(-10,-38); ctx.lineTo(-10,-28); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(-9,-33,2.4,0,7); ctx.fill(); }
    ctx.restore();
  }

  var LEO_COAT = {base:'#e9dccb',belly:'#fff6ef',dark:'#b79a7a',nose:'#e88aa8',blush:'rgba(246,161,196,.55)',bow:'#f6a1c4'};
  var DEMON_COAT = {base:'#b48a5c',belly:'#efe3cf',dark:'#7c5a38',nose:'#caa07f'};

  function spawnBloom(){
    scenery.push({kind:'bloom', x:W+20, y:H*0.80+ (Math.random()*24-12),
      hue:['#ffd7e6','#f6a1c4','#cbb3f0','#fff0d8'][(Math.random()*4)|0],
      r:0, rt:5+Math.random()*5, lean:(Math.random()*0.5-0.25)});
  }
  function spawnMemory(emoji){
    scenery.push({kind:'mem', x:W+30, y:H*0.34, emoji:emoji, a:0, life:0});
  }
  function burstHearts(n){
    for(var i=0;i<n;i++) hearts.push({x:W*0.5+(Math.random()*W*0.5-W*0.25), y:H*0.55,
      vx:(Math.random()*2-1)*40, vy:-30-Math.random()*60, life:0, ttl:2.2+Math.random(),
      s:10+Math.random()*14, hue:Math.random()<0.5?'#f6a1c4':'#ffd7e6'});
  }

  function heartPath(cx,cy,s){
    ctx.beginPath();
    ctx.moveTo(cx,cy+s*0.3);
    ctx.bezierCurveTo(cx+s*0.5,cy-s*0.3,cx+s*0.5,cy+s*0.15,cx,cy+s*0.6);
    ctx.bezierCurveTo(cx-s*0.5,cy+s*0.15,cx-s*0.5,cy-s*0.3,cx,cy+s*0.3);
    ctx.closePath();
  }

  function render(dt){
    // ease world params
    sky.top = lerpRGB(sky.top, skyTarget.top, Math.min(1,dt*1.4));
    sky.bot = lerpRGB(sky.bot, skyTarget.bot, Math.min(1,dt*1.4));
    rainDensity = lerp(rainDensity, rainTarget, Math.min(1,dt*1.5));
    warmth = lerp(warmth, warmthT, Math.min(1,dt*1.2));
    starsAlpha = lerp(starsAlpha, starsT, Math.min(1,dt*1.0));
    moonY = lerp(moonY, moonTarget, Math.min(1,dt*0.8));
    moonGlow = lerp(moonGlow, moonGlowT, Math.min(1,dt*1.5));
    if(shake>0) shake=Math.max(0,shake-dt*2.5);

    var sx=0, sy=0;
    if(shake>0 && !reduce){ sx=(Math.random()*2-1)*shake*8; sy=(Math.random()*2-1)*shake*6; }
    ctx.save();
    ctx.translate(sx,sy);

    // sky
    var g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, rgb(sky.top)); g.addColorStop(1, rgb(sky.bot));
    ctx.fillStyle=g; ctx.fillRect(-20,-20,W+40,H+40);

    // stars
    if(starsAlpha>0.01){
      for(var i=0;i<70;i++){
        var stx=((i*97)%W), sty=((i*57)%(H*0.55));
        var tw = 0.5+0.5*Math.sin(t0*2 + i);
        ctx.fillStyle='rgba(255,255,255,'+(starsAlpha*(0.25+0.55*tw))+')';
        ctx.fillRect(stx, sty, 1.6, 1.6);
      }
    }
    // moon
    if(moonY>-100){
      var mx=W*0.5, my=moonY;
      if(moonGlow>0.01){
        var rg=ctx.createRadialGradient(mx,my,10,mx,my,120);
        rg.addColorStop(0,'rgba(255,247,224,'+(0.5*moonGlow)+')');
        rg.addColorStop(1,'rgba(255,247,224,0)');
        ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(mx,my,120,0,7); ctx.fill();
      }
      ctx.fillStyle='#fff7e0'; ctx.beginPath(); ctx.arc(mx,my,44,0,7); ctx.fill();
      ctx.fillStyle='rgba(230,220,190,.35)';
      ctx.beginPath(); ctx.arc(mx-14,my-8,7,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(mx+12,my+10,5,0,7); ctx.fill();
    }

    // ground band
    var groundY=H*0.86;
    var gg=ctx.createLinearGradient(0,groundY,0,H);
    var warmGround = lerpRGB([26,22,44],[70,40,60], warmth);
    gg.addColorStop(0, rgb(warmGround, .9)); gg.addColorStop(1, rgb([10,8,20]));
    ctx.fillStyle=gg; ctx.fillRect(-20,groundY,W+40,H-groundY+20);
    // scrolling ground dashes
    ctx.strokeStyle='rgba(255,255,255,'+(0.06+0.06*warmth)+')'; ctx.lineWidth=2;
    for(var d=-1;d<W/34+1;d++){
      var dx=(d*34 - (groundOffset%34));
      ctx.beginPath(); ctx.moveTo(dx,groundY+10); ctx.lineTo(dx+14,groundY+10); ctx.stroke();
    }

    // scenery (blooms + memories) drift
    for(var s=scenery.length-1;s>=0;s--){
      var it=scenery[s];
      if(it.kind==='bloom'){
        if(it.r<it.rt) it.r+=dt*18;
        var by=it.y;
        // stem
        ctx.strokeStyle='rgba(150,200,150,.6)'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(it.x,by+14); ctx.lineTo(it.x+it.lean*8,by); ctx.stroke();
        // petals
        ctx.fillStyle=it.hue;
        for(var p=0;p<5;p++){ var ang=p/5*Math.PI*2 + t0*0.2;
          ctx.beginPath(); ctx.ellipse(it.x+Math.cos(ang)*it.r, by+Math.sin(ang)*it.r, it.r*0.6, it.r*0.4, ang,0,7); ctx.fill(); }
        ctx.fillStyle='#fff0d8'; ctx.beginPath(); ctx.arc(it.x,by,it.r*0.5,0,7); ctx.fill();
        if(it.x<-30) scenery.splice(s,1);
      } else { // memory glow
        it.life+=dt; it.a=Math.min(1,it.a+dt*1.2);
        if(it.life>3.4) it.a=Math.max(0,it.a-dt*1.2);
        var pulse=1+0.08*Math.sin(t0*3);
        ctx.save(); ctx.globalAlpha=it.a;
        var rg2=ctx.createRadialGradient(it.x,it.y,2,it.x,it.y,34);
        rg2.addColorStop(0,'rgba(255,220,240,.8)'); rg2.addColorStop(1,'rgba(255,220,240,0)');
        ctx.fillStyle=rg2; ctx.beginPath(); ctx.arc(it.x,it.y,34*pulse,0,7); ctx.fill();
        ctx.globalAlpha=it.a; ctx.font='26px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(it.emoji, it.x, it.y);
        ctx.restore();
        if(it.a<=0 && it.life>3.4) scenery.splice(s,1);
      }
    }

    // cats
    var gy=groundY-6;
    var moving = holding && walkStepIsWalk();
    if(moving){ walkPhase+=dt*10; }
    leo.bob = Math.sin(walkPhase)*3*(moving?1:0.3);
    demon.bob = Math.sin(walkPhase+0.6)*3*(moving?1:0.3);
    // demon behind leo by gap
    var demonScreenX = (leo.x - demon.gap) * W;
    var leoScreenX = leo.x * W;
    if(demon.alpha>0.01){
      drawCat(demonScreenX, gy+demon.bob, demon.scale, DEMON_COAT, 'serious', demon.alpha);
    }
    drawCat(leoScreenX, gy+leo.bob, leo.scale, LEO_COAT, warmth>0.5?'happy':'normal', leo.alpha);

    // rain
    if(rainDensity>0.02 && !reduce){
      ctx.strokeStyle='rgba(190,200,225,'+(0.22*rainDensity)+')'; ctx.lineWidth=1.3;
      for(var r=0;r<rain.length;r++){
        var rr=rain[r];
        if(r/rain.length>rainDensity) continue;
        var rx=rr.x*W, ry=rr.y*H;
        ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(rx-2, ry+rr.l); ctx.stroke();
        rr.y+=rr.s*dt*2.2; rr.x-=0.02*dt;
        if(rr.y>1){ rr.y=-0.05; rr.x=Math.random(); }
      }
    }

    // hearts
    for(var h=hearts.length-1;h>=0;h--){
      var ht=hearts[h]; ht.life+=dt;
      ht.x+=ht.vx*dt; ht.y+=ht.vy*dt; ht.vy+=8*dt;
      var a=1-ht.life/ht.ttl;
      if(a<=0){ hearts.splice(h,1); continue; }
      ctx.fillStyle=ht.hue; ctx.globalAlpha=Math.max(0,a);
      heartPath(ht.x,ht.y,ht.s); ctx.fill(); ctx.globalAlpha=1;
    }

    ctx.restore();
  }

  /* ============================================================
     SCRIPT — the steps (sad -> twist -> warm -> storm -> moon)
     ============================================================ */
  var textEl=document.getElementById('text'), hintEl=document.getElementById('hint');
  function showText(html, center){
    textEl.innerHTML=html;
    textEl.className = 'show' + (center?' center':'');
  }
  function hideText(){ textEl.className = textEl.className.replace('show','').trim(); }
  function showHint(txt){ if(txt){ hintEl.textContent=txt; hintEl.className='show'; } else hintEl.className=''; }

  function fx(fn){ return {type:'fx', fn:fn}; }
  function say(html,opts){ opts=opts||{}; return {type:'say', html:html, tap:opts.tap!==false, dur:opts.dur||2800, center:!!opts.center}; }
  function walk(dist,hint){ return {type:'walk', dist:dist, hint:hint||'hold to walk  →'}; }
  function wait(ms){ return {type:'wait', ms:ms}; }

  var STEPS = [
    fx(function(){ skyTarget={top:[40,44,66],bot:[16,16,30]}; rainTarget=1.0; warmthT=0; starsT=0.15;
      leo.alpha=1; demon.alpha=0; demon.gap=0.16; setMode('lonely',0.25); }),
    say("some days it feels like<br>you're walking this alone.", {center:true}),
    walk(70),
    say("i know it's dark right now.<br>keep going, baby."),
    walk(70),
    say("a little further.<br>i promise it's worth it."),
    walk(70),
    fx(function(){ /* leo slows */ }),
    say("…you stopped.<br>you think you can't go on alone.", {center:true}),
    fx(function(){
      demon.alpha=1; setMode('warm',0.16);
      skyTarget={top:[70,54,86],bot:[34,26,52]}; rainTarget=0.4; warmthT=0.35; starsT=0.05;
      burstHearts(6);
    }),
    say("look behind you.", {center:true}),
    say("i've been three steps back<br>since your very first one.", {center:true}),
    say("making sure the dark<br>never once caught you.", {center:true}),
    fx(function(){
      skyTarget={top:[255,200,224],bot:[120,80,130]}; rainTarget=0.12; warmthT=0.85;
      setMode('warm',0.08); demon.gap=0.14;
    }),
    say("<span class='big'>you were never walking alone,<br>"+HER+".</span>", {center:true}),
    say("not once.", {center:true}),
    fx(function(){ spawnBloom(); }),
    say("there. that's better.<br>now we walk together. 🤍"),
    walk(60,'hold — together now  →'),
    fx(function(){ spawnMemory('🎵'); }),
    say("the night we met.<br>the whole world was loud. you were the quiet i kept."),
    walk(55),
    fx(function(){ spawnMemory('☕'); }),
    say("every coffee since.<br>iced americano. i never had to ask."),
    walk(55),
    fx(function(){ spawnMemory('🎮'); }),
    say("the nights you beat me<br>at my own games. proud every single time."),
    walk(55),
    fx(function(){ spawnMemory('🐾'); }),
    say("the home we built.<br>Leo. Demon. the little life that's ours."),
    walk(50),
    say("…he still looks grumpy, huh."),
    say("that's just his face. you know the one.<br>he loves you loudest of all of us."),
    // storm
    fx(function(){
      skyTarget={top:[30,30,52],bot:[10,10,22]}; rainTarget=1.0; warmthT=0.2; starsT=0;
      setMode('cold',0.4); demon.gap=0.30; shake=1.0;
    }),
    say("…and then there's this part.<br>the storm. the words we don't mean.", {center:true}),
    walk(80,'hold — find your way back  →'),
    fx(function(){
      demon.gap=0.14; shake=0.4; setMode('warm',0.1);
      skyTarget={top:[120,80,130],bot:[40,30,60]}; rainTarget=0.2; warmthT=0.7; burstHearts(8);
    }),
    say("every single time.<br>we always find the way back.", {center:true}),
    say("every time, baby. i promise you that.", {center:true}),
    // climb to moon
    fx(function(){
      skyTarget={top:[26,20,52],bot:[10,8,24]}; rainTarget=0.0; warmthT=0.5; starsT=1;
      moonTarget=H*0.62; setMode('swell',0); setHeartbeat(true); demon.gap=0.12;
    }),
    say("almost there now.<br>together this time."),
    walk(75,'hold — climb with me  →'),
    fx(function(){
      moonTarget=H*0.34; moonGlowT=1; burstHearts(14); leo.alpha=1; demon.alpha=1;
    }),
    say("remember Edgerunners?<br>Lucy reached the moon alone. and you cried.", {center:true}),
    say("look beside you, baby.<br><span class='big'>you never will.</span>", {center:true}),
    fx(function(){ burstHearts(20); }),
    say("i'm right here.<br><span class='script'>still here.</span>", {center:true}),
    fx(function(){ setHeartbeat(false); starsT=1; }),
    say("the best thing that ever<br>happened to me.", {center:true}),
    say("<span class='script'>"+HER+"</span>", {center:true}),
    fx(function(){ endGame(); })
  ];

  /* ---------- step runner ---------- */
  var idx=-1, cur=null, sTimer=0, sRemain=0;
  function walkStepIsWalk(){ return cur && cur.type==='walk'; }
  function startStep(){
    idx++;
    cur = STEPS[idx];
    if(!cur) return;
    if(cur.type==='fx'){ try{cur.fn();}catch(e){} startStep(); return; }
    if(cur.type==='say'){
      showText(cur.html, cur.center);
      if(cur.tap){ showHint('tap to continue  🤍'); freshTap=false; }
      else { sTimer=cur.dur; }
      return;
    }
    if(cur.type==='walk'){ sRemain=cur.dist; showHint(cur.hint); hideText(); return; }
    if(cur.type==='wait'){ sTimer=cur.ms; return; }
  }
  function updateStep(dt){
    if(!cur) return;
    if(cur.type==='say'){
      if(cur.tap){
        if(freshTap){ freshTap=false; hideText(); showHint(''); startStep(); }
      } else {
        sTimer-=dt*1000; if(sTimer<=0){ hideText(); startStep(); }
      }
    } else if(cur.type==='walk'){
      if(holding){
        var mv = 42*dt;                 // walk speed
        sRemain-=mv; groundOffset+=mv*2.2;
        // trail blooms while warm
        if(warmth>0.5 && Math.random()<dt*2.2) spawnBloom();
        if(sRemain<=0){ showHint(''); startStep(); }
      }
    } else if(cur.type==='wait'){
      sTimer-=dt*1000; if(sTimer<=0) startStep();
    }
  }

  /* ---------- loop ---------- */
  var running=false;
  function frame(ts){
    if(!running) return;
    if(!lastT) lastT=ts;
    var dt=Math.min(0.05,(ts-lastT)/1000); lastT=ts; t0+=dt;
    updateStep(dt);
    render(dt);
    requestAnimationFrame(frame);
  }

  /* ---------- start / end ---------- */
  var startEl=document.getElementById('start'), endEl=document.getElementById('end');
  document.getElementById('beginBtn').addEventListener('click', function(){
    resize(); initRain(); audioInit();
    startEl.classList.add('fadeout');
    setTimeout(function(){ startEl.style.display='none'; }, 1000);
    running=true; lastT=0; idx=-1;
    requestAnimationFrame(frame);
    startStep();
  });

  function endGame(){
    setMode('warm',0);
    document.getElementById('endMsg').innerHTML =
      "this was chapter one.<br>chapter two is the rest of our lives.<br><br>"+
      "i'm not going anywhere, "+HER+".<br>i never was. — "+HIM+" 🤍";
    endEl.classList.remove('fadeout'); endEl.style.opacity='1'; endEl.style.pointerEvents='auto';
    burstHearts(24);
  }
  document.getElementById('replayBtn').addEventListener('click', function(){
    endEl.style.opacity='0'; endEl.style.pointerEvents='none';
    scenery.length=0; hearts.length=0; groundOffset=0; walkPhase=0;
    demon.alpha=0; demon.gap=0.16; warmth=0; warmthT=0; moonY=-120; moonTarget=-120; moonGlowT=0; starsT=0.15;
    idx=-1; startStep();
  });

  resize();
})();
</script>
