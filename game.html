<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>US — a point &amp; click story 🤍</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%A4%8D%3C/text%3E%3C/svg%3E">
<style>
  :root{--font:ui-rounded,-apple-system,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
    --script:"Snell Roundhand","Savoye LET","Apple Chancery",cursive;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{height:100%;overflow:hidden;background:#000;font-family:var(--font);color:#fff;touch-action:none}
  #scene{position:fixed;inset:0;background-size:cover;background-position:center;
    animation:ken 30s ease-in-out infinite alternate;will-change:transform}
  @keyframes ken{0%{transform:scale(1.06) translate(1%,0)}100%{transform:scale(1.15) translate(-2%,-1%)}}
  #vig{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 80% at 50% 42%,transparent 42%,rgba(0,0,0,.62) 100%)}
  #grain{position:fixed;inset:0;pointer-events:none;opacity:.06;mix-blend-mode:overlay}
  .bar{position:fixed;left:0;right:0;height:0;background:#000;z-index:4;transition:height .9s ease}
  #barT{top:0}#barB{bottom:0}
  body.cine .bar{height:7.5vh}
  /* hotspots */
  .hs{position:fixed;transform:translate(-50%,-50%);z-index:3;cursor:pointer;width:48px;height:48px;
    display:flex;align-items:center;justify-content:center}
  .hs .ring{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,214,235,.9);
    box-shadow:0 0 16px 5px rgba(255,140,200,.7);animation:pulse 1.8s ease-in-out infinite}
  .hs .core{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff}
  .hs.found .ring{border-color:rgba(255,255,255,.25);box-shadow:none;animation:none}
  .hs.found .core{background:rgba(255,255,255,.35);box-shadow:none}
  @keyframes pulse{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.25);opacity:1}}
  /* dialogue */
  #dlg{position:fixed;left:50%;bottom:11vh;transform:translateX(-50%) translateY(16px);z-index:6;
    width:min(640px,92vw);background:linear-gradient(180deg,rgba(20,10,28,.55),rgba(20,10,28,.85));
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,182,214,.3);
    border-radius:18px;padding:18px 22px 20px;opacity:0;transition:opacity .5s,transform .5s;pointer-events:none;
    box-shadow:0 18px 50px rgba(0,0,0,.6)}
  #dlg.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  #dtag{font-size:11px;font-weight:800;letter-spacing:1.4px;color:#ffb6d6;margin-bottom:8px;text-shadow:0 0 12px rgba(246,161,196,.6)}
  #dtext{font-size:clamp(16px,4.5vw,20px);line-height:1.55;font-weight:600;min-height:56px}
  #dadv{text-align:right;font-size:12px;color:rgba(255,255,255,.55);margin-top:8px;opacity:0;animation:blink 1.4s infinite}
  #dadv.show{opacity:1}
  @keyframes blink{0%,100%{opacity:.3}50%{opacity:.9}}
  #prog{position:fixed;top:calc(7.5vh + 12px);left:16px;z-index:5;font-size:12px;font-weight:800;letter-spacing:.5px;
    color:rgba(255,255,255,.85);background:rgba(0,0,0,.35);padding:6px 12px;border-radius:20px}
  #cont{position:fixed;left:50%;bottom:10vh;transform:translateX(-50%);z-index:6;opacity:0;pointer-events:none;
    transition:opacity .6s;cursor:pointer;border:none;border-radius:999px;padding:14px 26px;font-family:var(--font);
    font-size:16px;font-weight:800;color:#4a1030;background:linear-gradient(180deg,#ffd7e6,#f6a1c4);box-shadow:0 10px 30px rgba(230,92,147,.5)}
  #cont.show{opacity:1;pointer-events:auto;animation:floaty 2.2s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}
  #cont:active{transform:translateX(-50%) scale(.94)}
  #mute{position:fixed;top:calc(7.5vh + 10px);right:14px;z-index:7;cursor:pointer;width:40px;height:40px;border-radius:50%;
    border:none;background:rgba(255,255,255,.14);color:#fff;font-size:18px}
  .over{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;text-align:center;padding:34px;background:radial-gradient(120% 90% at 50% 40%,#241033,#140a20 62%,#000);transition:opacity 1s}
  .over.hide{opacity:0;pointer-events:none}
  .ttl{font-family:var(--script);font-size:clamp(54px,18vw,110px);text-shadow:0 0 40px rgba(246,161,196,.7);line-height:.9}
  .k{font-size:12px;letter-spacing:5px;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:-8px}
  .sub{font-size:clamp(15px,4.3vw,18px);color:rgba(255,255,255,.85);max-width:440px;line-height:1.55}
  .btn{cursor:pointer;border:none;border-radius:999px;padding:15px 30px;font-family:var(--font);font-size:16px;font-weight:800;
    color:#4a1030;background:linear-gradient(180deg,#ffd7e6,#f6a1c4);box-shadow:0 12px 34px rgba(230,92,147,.5)}
  .btn:active{transform:scale(.93)}
</style>
</head>
<body>
<div id="scene"></div>
<div id="vig"></div>
<canvas id="grain"></canvas>
<div class="bar" id="barT"></div>
<div class="bar" id="barB"></div>
<div id="prog"></div>
<button id="mute" aria-label="sound">🔊</button>
<div id="dlg"><div id="dtag">✦ MEMORY</div><div id="dtext"></div><div id="dadv">tap to continue ›</div></div>
<button id="cont">the night goes on  ➜</button>

<div class="over" id="start">
  <div class="k">chapter one</div>
  <div class="ttl">Us</div>
  <div class="sub">the night we met.<br>tap the glowing memories to remember. 🤍<br><span style="opacity:.6;font-size:13px">headphones on if you can</span></div>
  <button class="btn" id="beginBtn">▶ begin</button>
</div>

<div class="over hide" id="end">
  <div class="k">chapter one — complete</div>
  <div class="ttl" style="font-size:clamp(30px,9vw,54px)">the night we met</div>
  <div class="sub" id="endSub"></div>
  <button class="btn" id="replayBtn">↺ relive it</button>
</div>

  function grain(){
    var img=gc.createImageData(gw,gh), d=img.data;
    for(var i=0;i<d.length;i+=4){ var v=(Math.random()*255)|0; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; }
    gc.putImageData(img,0,0);
    if(!reduce) requestAnimationFrame(grain);
  }

  // hotspots
  var spots=[
    {x:47,y:57,tag:'THE MOMENT', text:"November 27, 2022. i told you i'd be here. you came looking. and then — through all these people — we found each other. we still argue about who found who."},
    {x:50,y:15,tag:'THE LIGHTS', text:"the concert was loud enough to disappear in. somehow, the only thing i heard was you."},
    {x:66,y:60,tag:'YOUR FRIEND',text:"your friend was right beside you. you kept scanning the crowd anyway. so did i. we were both just looking for each other."},
    {x:28,y:84,tag:'LATER THAT NIGHT',text:"then we laid on the grass, laughing so hard it hurt, and watched the moon. i didn't know it yet — that moon was about to become ours."}
  ];
  var found=0;
  var dlg=document.getElementById('dlg'),dtag=document.getElementById('dtag'),
      dtext=document.getElementById('dtext'),dadv=document.getElementById('dadv'),prog=document.getElementById('prog');
  var typing=false,typer=0,fullTxt='',ti=0,openIdx=-1;

  function makeSpots(){
    spots.forEach(function(s,i){
      var el=document.createElement('div'); el.className='hs'; el.style.left=s.x+'%'; el.style.top=s.y+'%';
      el.innerHTML='<div class="ring"></div><div class="core"></div>';
      el.addEventListener('click',function(e){ e.stopPropagation(); open(i,el); });
      document.body.appendChild(el); s.el=el;
    });
  }
  function updProg(){ prog.textContent='moments  '+found+' / '+spots.length; }

  function open(i,el){
    if(typing){ finish(); return; }
    openIdx=i; dtag.textContent='✦ '+spots[i].tag;
    dlg.classList.add('show'); dadv.classList.remove('show');
    fullTxt=spots[i].text; ti=0; dtext.textContent=''; typing=true;
    clearInterval(typer);
    typer=setInterval(function(){ ti++; dtext.textContent=fullTxt.slice(0,ti);
      if(ti>=fullTxt.length){ clearInterval(typer); typing=false; dadv.classList.add('show'); } },28);
    if(!spots[i].done){ spots[i].done=true; el.classList.add('found'); found++; updProg(); ping(); }
  }
  function finish(){ clearInterval(typer); dtext.textContent=fullTxt; typing=false; dadv.classList.add('show'); }
  function closeDlg(){
    if(typing){ finish(); return; }
    dlg.classList.remove('show'); openIdx=-1;
    if(found>=spots.length) document.getElementById('cont').classList.add('show');
  }
  document.body.addEventListener('click',function(){ if(dlg.classList.contains('show')) closeDlg(); });
  dlg.addEventListener('click',function(e){ e.stopPropagation(); closeDlg(); });

  // audio: soft cinematic pad
  var AC=null,mg=null,muted=false;
  function audio(){
    if(AC) return;
    try{ var C=window.AudioContext||window.webkitAudioContext; AC=new C();
      mg=AC.createGain(); mg.gain.value=0.0001; mg.connect(AC.destination);
      mg.gain.linearRampToValueAtTime(0.13,AC.currentTime+2.5);
      var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=760; lp.connect(mg);
      [146.83,220,277.18].forEach(function(f,i){ var o=AC.createOscillator(),ga=AC.createGain();
        o.type='sine'; o.frequency.value=f; o.detune.value=(i-1)*6; ga.gain.value=0.5/(i+1);
        o.connect(ga); ga.connect(lp); o.start(); }); }catch(e){ AC=null; }
  }
  function ping(){ if(!AC||muted) return; var o=AC.createOscillator(),ga=AC.createGain(),t=AC.currentTime;
    o.type='sine'; o.frequency.value=660; ga.gain.setValueAtTime(0.0001,t);
    ga.gain.linearRampToValueAtTime(0.09,t+0.03); ga.gain.exponentialRampToValueAtTime(0.0001,t+1.1);
    o.connect(ga); ga.connect(AC.destination); o.start(t); o.stop(t+1.2); }
  document.getElementById('mute').addEventListener('click',function(e){ e.stopPropagation();
    muted=!muted; this.textContent=muted?'🔈':'🔊'; if(AC) mg.gain.linearRampToValueAtTime(muted?0.0001:0.13,AC.currentTime+0.3); });

  document.getElementById('cont').addEventListener('click',function(e){ e.stopPropagation();
    document.getElementById('endSub').innerHTML=
      "that was the beginning. the coffee, the cats, the fights, the coming-back, the moon that became ours — it's all still ahead.<br><br>"+
      "this is chapter one of <b>us</b>, baby. 🤍";
    document.getElementById('end').classList.remove('hide');
  });
  document.getElementById('replayBtn').addEventListener('click',function(e){ e.stopPropagation();
    document.getElementById('end').classList.add('hide');
    found=0; spots.forEach(function(s){ s.done=false; s.el.classList.remove('found'); });
    document.getElementById('cont').classList.remove('show'); updProg();
  });

  document.getElementById('beginBtn').addEventListener('click',function(){
    audio(); document.getElementById('start').classList.add('hide');
    document.body.classList.add('cine'); makeSpots(); updProg();
    if(!reduce) requestAnimationFrame(grain);
  });
})();
</script>
</body>
</html>
