<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>US — HD 2D 🤍</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%A4%8D%3C/text%3E%3C/svg%3E">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{height:100%;overflow:hidden;background:#0d0916;touch-action:none;
    font-family:ui-rounded,-apple-system,"Segoe UI",system-ui,sans-serif;color:#fff}
  #room{position:fixed;inset:0;background-size:cover;background-position:center;
    image-rendering:auto}
  #tint{position:fixed;inset:0;pointer-events:none;
    background:linear-gradient(to bottom,rgba(12,8,22,.28),transparent 26%,rgba(12,8,22,.18))}
  #hero{position:fixed;left:50%;top:76%;height:44vh;transform-origin:bottom center;pointer-events:none;
    filter:drop-shadow(0 8px 10px rgba(0,0,0,.45));will-change:transform,left,top}
  .marker{position:fixed;transform:translate(-50%,-50%);pointer-events:none;z-index:3}
  .marker .dot{width:16px;height:16px;border-radius:50%;background:#ffd7ea;
    box-shadow:0 0 14px 4px rgba(255,150,200,.85);animation:bob 1.6s ease-in-out infinite}
  .marker .lbl{position:absolute;left:50%;top:-26px;transform:translateX(-50%);white-space:nowrap;
    font-size:12px;font-weight:800;letter-spacing:.4px;color:#fff;text-shadow:0 1px 6px #000;
    background:rgba(20,10,28,.6);padding:3px 9px;border-radius:20px;opacity:0;transition:opacity .25s}
  .marker.near .lbl{opacity:1}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  /* controls */
  #pad{position:fixed;left:14px;bottom:max(20px,env(safe-area-inset-bottom));width:150px;height:150px;z-index:6;touch-action:none}
  .dbtn{position:absolute;width:50px;height:50px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);
    border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;backdrop-filter:blur(4px)}
  #up{left:50px;top:0}#down{left:50px;top:100px}#left{left:0;top:50px}#right{left:100px;top:50px}
  #act{position:fixed;right:22px;bottom:max(40px,env(safe-area-inset-bottom));z-index:6;width:76px;height:76px;border-radius:50%;
    border:2px solid rgba(255,182,214,.7);background:radial-gradient(circle at 40% 35%,#ffe0ee,#f6a1c4);
    color:#5a1636;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(230,92,147,.5)}
  .press{transform:scale(.9);filter:brightness(1.15)}
  #bubble{position:fixed;left:50%;top:9%;transform:translateX(-50%);width:min(540px,90vw);z-index:7;
    background:rgba(20,10,28,.9);border:1px solid rgba(255,182,214,.42);border-radius:16px;padding:15px 18px;
    font-size:clamp(15px,4.4vw,18px);font-weight:600;line-height:1.5;opacity:0;transition:opacity .3s;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  #bubble.show{opacity:1}
  #bubble .n{color:#ffb6d6;font-weight:800;display:block;margin-bottom:4px;font-size:12px;letter-spacing:.5px}
  #hint{position:fixed;left:50%;top:3.5%;transform:translateX(-50%);z-index:6;font-size:13px;color:#fff;
    background:rgba(0,0,0,.32);padding:6px 12px;border-radius:20px;opacity:0;transition:opacity .3s}
  #hint.show{opacity:1}
  .over{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;text-align:center;padding:34px;background:radial-gradient(120% 90% at 50% 40%,#2a1330,#160a22 60%,#0b0712);transition:opacity .8s}
  .over.hide{opacity:0;pointer-events:none}
  .ttl{font-family:"Snell Roundhand","Savoye LET",cursive;font-size:clamp(46px,16vw,92px);text-shadow:0 0 30px rgba(246,161,196,.7)}
  .sub{font-size:clamp(15px,4.3vw,18px);color:rgba(255,255,255,.85);max-width:440px;line-height:1.55}
  .btn{cursor:pointer;border:none;border-radius:999px;padding:15px 28px;font-family:inherit;font-size:16px;font-weight:800;
    color:#4a1030;background:linear-gradient(180deg,#ffd7e6,#f6a1c4);box-shadow:0 10px 30px rgba(230,92,147,.5)}
  .btn:active{transform:scale(.93)}
</style>
</head>
<body>
<div id="room"></div>
<div id="tint"></div>
<img id="hero" alt="">
<div id="hint"></div>
<div id="bubble"></div>

<div id="pad">
  <div class="dbtn" id="up">▲</div><div class="dbtn" id="down">▼</div>
  <div class="dbtn" id="left">◀</div><div class="dbtn" id="right">▶</div>
</div>
<div id="act">A</div>

<div class="over" id="start">
  <div class="ttl">Us</div>
  <div class="sub">HD 2D. move with the pad, tap <b>A</b> at the glowing spots.<br>walk around your room, baby. 🤍</div>
  <button class="btn" id="beginBtn">▶ play</button>
</div>

  document.getElementById('room').style.backgroundImage="url('"+ROOM+"')";
  var hero=document.getElementById('hero'); hero.src=HERO;

  // world coords in % of viewport. floor band.
  var P={x:50,y:80,dir:1,moving:false,t:0};
  var FLOOR={minX:10,maxX:90,minY:62,maxY:88};

  var markers=[
    {x:20,y:66,label:'your setup', say:"player 2's chair. still warm. he never really logs off."},
    {x:50,y:63,label:'the bed',    say:"where you fall asleep on video call. every night. same time."},
    {x:80,y:66,label:'your figures',say:"your shelf. he added the newest one last week — didn't even mention it."},
    {x:40,y:85,label:'the cats',   say:"Leo and Demon. they picked this spot. they picked you first, honestly."}
  ];
  // build marker els
  var mEls=[];
  markers.forEach(function(m){
    var d=document.createElement('div'); d.className='marker';
    d.innerHTML='<div class="lbl">'+m.label+'</div><div class="dot"></div>';
    d.style.left=m.x+'%'; d.style.top=m.y+'%'; document.body.appendChild(d); mEls.push(d);
  });

  // input
  var keys={up:false,down:false,left:false,right:false};
  function bind(id,k){var el=document.getElementById(id);
    var on=function(e){keys[k]=true;el.classList.add('press');if(e.cancelable)e.preventDefault();};
    var off=function(e){keys[k]=false;el.classList.remove('press');if(e&&e.cancelable)e.preventDefault();};
    el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);
    el.addEventListener('pointerleave',off);el.addEventListener('pointercancel',off);}
  bind('up','up');bind('down','down');bind('left','left');bind('right','right');
  var KM={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',KeyW:'up',KeyS:'down',KeyA:'left',KeyD:'right'};
  addEventListener('keydown',function(e){if(KM[e.code]){keys[KM[e.code]]=true;e.preventDefault();}if(e.code==='Space'){interact();e.preventDefault();}});
  addEventListener('keyup',function(e){if(KM[e.code]){keys[KM[e.code]]=false;e.preventDefault();}});
  var actBtn=document.getElementById('act');
  actBtn.addEventListener('pointerdown',function(e){actBtn.classList.add('press');interact();if(e.cancelable)e.preventDefault();});
  actBtn.addEventListener('pointerup',function(){actBtn.classList.remove('press');});

  var bubble=document.getElementById('bubble'),hint=document.getElementById('hint'),bubbleT=0;
  function near(){var best=null,bd=99;markers.forEach(function(m){var d=Math.hypot(P.x-m.x,(P.y-m.y)*1.1);if(d<13&&d<bd){bd=d;best=m;}});return best;}
  function interact(){var m=near();if(!m)return;bubble.innerHTML='<span class="n">'+m.label.toUpperCase()+'</span>'+m.say;bubble.classList.add('show');bubbleT=3.4;}

  var running=false,last=0;
  function frame(ts){
    if(!running)return;
    if(!last)last=ts;var dt=Math.min(0.05,(ts-last)/1000);last=ts;
    var sp=17*dt,mv=false;
    if(keys.up){P.y-=sp*0.8;mv=true;}
    else if(keys.down){P.y+=sp*0.8;mv=true;}
    if(keys.left){P.x-=sp;P.dir=-1;mv=true;}
    else if(keys.right){P.x+=sp;P.dir=1;mv=true;}
    if(P.x<FLOOR.minX)P.x=FLOOR.minX; if(P.x>FLOOR.maxX)P.x=FLOOR.maxX;
    if(P.y<FLOOR.minY)P.y=FLOOR.minY; if(P.y>FLOOR.maxY)P.y=FLOOR.maxY;
    P.moving=mv; if(mv)P.t+=dt;
    // depth: bigger near bottom
    var yN=(P.y-FLOOR.minY)/(FLOOR.maxY-FLOOR.minY);
    var depth=0.82+0.34*yN;
    var bob=P.moving?Math.sin(P.t*10)*2.2:0;
    var squash=P.moving?1+Math.sin(P.t*10)*0.02:1;
    hero.style.left=P.x+'%'; hero.style.top=P.y+'%';
    hero.style.transform='translate(-50%,-100%) scale('+depth+') scaleX('+P.dir+') translateY('+bob+'px) scaleY('+squash+')';
    // markers
    var nm=near();
    mEls.forEach(function(el,i){ el.classList.toggle('near', markers[i]===nm); });
    if(nm&&bubbleT<=0){hint.textContent='tap A';hint.classList.add('show');} else hint.classList.remove('show');
    if(bubbleT>0){bubbleT-=dt;if(bubbleT<=0)bubble.classList.remove('show');}
    requestAnimationFrame(frame);
  }
  document.getElementById('beginBtn').addEventListener('click',function(){
    document.getElementById('start').classList.add('hide');
    running=true;last=0;requestAnimationFrame(frame);
    hint.textContent='walk to a glowing spot';hint.classList.add('show');
    setTimeout(function(){hint.classList.remove('show');},2600);
  });
})();
